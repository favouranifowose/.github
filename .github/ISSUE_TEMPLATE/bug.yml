name: Bug
description: Report something that does not work as expected.
title: 'bug: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the URL, browser or runtime version, and relevant logs without secrets.
    validations:
      required: true
