name: Deploy Worker
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment for secrets and deployment approval (production or preview).
        type: string
        required: true
      wrangler-environment:
        description: Optional named Wrangler environment; empty uses the top-level configuration.
        type: string
        default: ''
      preview:
        description: Upload a preview version without changing the active deployment.
        type: boolean
        default: false
      working-directory:
        description: Directory containing package.json, bun.lock and Wrangler configuration.
        type: string
        default: '.'
      bun-version:
        description: Exact Bun version.
        type: string
        default: '1.3.11'
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Scoped Cloudflare token with permission to upload or deploy this Worker.
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account owning the Worker.
        required: true
permissions: {}
concurrency:
  group: shared-worker-${{ inputs.environment }}-${{ inputs.working-directory }}-${{ inputs.preview && github.ref || 'deploy' }}
  cancel-in-progress: ${{ inputs.preview }}
jobs:
  deploy:
    # Never expose deployment credentials to fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.environment }}
      # wrangler-action maps versions upload's preview_url to deployment-url.
      url: ${{ steps.wrangler.outputs.deployment-url }}
    outputs:
      url: ${{ steps.wrangler.outputs.deployment-url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: favouranifowose/.github/actions/setup-bun@v1
        with:
          bun-version: ${{ inputs.bun-version }}
          registry-token: ${{ github.token }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Upload or deploy Worker
        id: wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          environment: ${{ inputs.wrangler-environment }}
          packageManager: bun
          command: ${{ inputs.preview && 'versions upload' || 'deploy' }}
  comment:
    needs: deploy
    if: inputs.preview && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Update preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          PREVIEW_KEY: ${{ inputs.environment }}:${{ inputs.working-directory }}
        with:
          script: |
            const url = new URL(process.env.PREVIEW_URL);
            if (url.protocol !== 'https:' || !url.hostname.endsWith('.workers.dev')) {
              throw new Error('Expected a Cloudflare workers.dev preview URL; enable preview_urls in Wrangler.');
            }
            const key = Buffer.from(process.env.PREVIEW_KEY).toString('base64');
            const marker = `<!-- shared-worker-preview:${key} -->`;
            const body = `${marker}\nWorker preview: ${url.href}`;
            const params = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...params, body});
            }
