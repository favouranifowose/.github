          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
  up-with-environment:
    needs: validate
    if: inputs.environment != '' && (inputs.command == 'up' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
