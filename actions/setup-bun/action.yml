name: Setup Bun
description: Install Bun and optionally authenticate the favouranifowose GitHub Packages scope.
inputs:
  bun-version:
    description: Exact Bun version to install.
    required: false
    default: '1.3.11'
  registry-token:
    description: Optional GitHub Packages token with read:packages access.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        no-cache: true
    - name: Configure GitHub Packages
      if: inputs.registry-token != ''
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        umask 077
        printf '\n@favouranifowose:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$REGISTRY_TOKEN" >> "$HOME/.npmrc"
